<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PhotoPose</title>
    <meta name="description" content="PhotoPose – AI photo pose guide. Discover poses, follow the live guide, get instant feedback." />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PhotoPose" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      /* Instant splash, rendered before any JS loads. */
      html, body { margin: 0; background: #0b0b0f; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #0b0b0f;
        transition: opacity 420ms cubic-bezier(.22,1,.36,1), transform 420ms cubic-bezier(.22,1,.36,1);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      }
      #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash img { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 18px 50px rgba(228,69,92,.35); animation: sp-pop 700ms cubic-bezier(.34,1.56,.64,1) both; }
      #splash .name { color: #f6f4f0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; animation: sp-fade 700ms 120ms both; }
      #splash .tag { color: #7c7a88; font-size: 14px; margin-top: -10px; animation: sp-fade 700ms 220ms both; }
      @keyframes sp-pop { from { transform: scale(.7); opacity: 0; } }
      @keyframes sp-fade { from { transform: translateY(6px); opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="icons/icon-192.png" alt="" />
      <div class="name">PhotoPose</div>
      <div class="tag">Pose like a pro</div>
    </div>
    <div id="root"></div>
    <noscript>PhotoPose needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
